name: HeadTrack
options:
  bundleIdPrefix: com.yusufk
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  minimumXcodeGenVersion: "2.40"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: true
    DEVELOPMENT_TEAM: 974B2L3FFB
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
  configs:
    Release:
      # Universal for distribution (Apple Silicon + Intel).
      ARCHS: "arm64 x86_64"
      ONLY_ACTIVE_ARCH: false

targets:
  HeadTrack:
    type: application
    platform: macOS
    sources:
      - path: HeadTrack
    info:
      path: HeadTrack/Resources/Info.plist
      properties:
        CFBundleDisplayName: HeadTrack
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.music
        NSCameraUsageDescription: "HeadTrack uses the camera to follow your head direction so sound stays fixed in the room. Frames are processed on this Mac and never stored or sent anywhere."
        NSAudioCaptureUsageDescription: "HeadTrack captures your Mac's audio so it can render it as spatial sound on your headphones. Audio stays on this Mac."
    entitlements:
      path: HeadTrack/Resources/HeadTrack.entitlements
      properties:
        com.apple.security.device.camera: true
    settings:
      base:
        PRODUCT_NAME: HeadTrack
        PRODUCT_BUNDLE_IDENTIFIER: com.yusufk.headtrack
        COMBINE_HIDPI_IMAGES: true
    scheme:
      testTargets:
        - HeadTrackTests

  HeadTrackTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HeadTrackTests
    dependencies:
      - target: HeadTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HeadTrack.app/Contents/MacOS/HeadTrack"
        BUNDLE_LOADER: "$(TEST_HOST)"
